name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Create deployment package
        working-directory: ./Frontend
        run: |
          mkdir -p ../deploy-frontend
          cp -r dist ../deploy-frontend/dist
          cp server.js ../deploy-frontend/server.js
          cp web.config ../deploy-frontend/web.config
          cp package.json ../deploy-frontend/package.json
          cd ../deploy-frontend
          npm install express --production

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ./deploy-frontend
